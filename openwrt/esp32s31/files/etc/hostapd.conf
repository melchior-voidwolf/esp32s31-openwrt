# ESP32-S31 softAP — esp_hosted (full-MAC cfg80211) + hostapd over nl80211.
# Managed by /etc/init.d/hostapd.  OPEN AP by design (firmware WPA limit).
interface=wlan0
bridge=br-lan
driver=nl80211

ssid=esp32s31-openwrt
country_code=CN
hw_mode=g
channel=6
ieee80211n=1
wmm_enabled=1

auth_algs=1

# Light-AP: no DHCP server runs on the board.
